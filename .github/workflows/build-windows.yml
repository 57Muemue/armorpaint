name: Build ArmorPaint - Windows x64

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      clean_build:
        description: "Delete previous build directory before compiling"
        required: true
        default: true
        type: boolean


jobs:
  build:

    name: ArmorPaint Windows x64 (${{ inputs.configuration }})

    runs-on: windows-2025

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================================
      # 2. Source information
      # ==========================================================

      - name: Show source revision
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "ArmorPaint source information"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Branch:"
          git branch --show-current

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE


      # ==========================================================
      # 3. Setup Visual Studio
      # ==========================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ==========================================================
      # 4. Setup Node.js
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================================
      # 5. Verify build tools
      # ==========================================================

      - name: Verify build tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Build environment"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "MSBuild:"
          where.exe msbuild
          msbuild -version

          Write-Host ""
          Write-Host "Clang:"
          where.exe clang-cl
          clang-cl --version

          Write-Host ""
          Write-Host "Visual Studio:"
          Write-Host $env:VisualStudioVersion

          Write-Host ""
          Write-Host "VC Tools:"
          Write-Host $env:VCToolsVersion


      # ==========================================================
      # 6. Clean previous build
      # ==========================================================

      - name: Clean previous build
        if: ${{ inputs.clean_build }}
        shell: powershell
        run: |
          $build = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          if (Test-Path $build) {

            Write-Host "Removing:"
            Write-Host $build

            Remove-Item `
              -Path $build `
              -Recurse `
              -Force
          }
          else {
            Write-Host "No previous build directory."
          }


      # ==========================================================
      # 7. Generate ArmorPaint project
      # ==========================================================

      - name: Generate ArmorPaint project
        shell: cmd
        working-directory: paint
        run: |

          echo ========================================
          echo Generating ArmorPaint Windows project
          echo ========================================

          ..\base\make

          if errorlevel 1 (
            echo.
            echo ========================================
            echo PROJECT GENERATION FAILED
            echo ========================================
            exit /b 1
          )


      # ==========================================================
      # 8. Find generated solution
      # ==========================================================

      - name: Find ArmorPaint solution
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          Write-Host "========================================"
          Write-Host "Finding ArmorPaint solution"
          Write-Host "========================================"

          if (-not (Test-Path $buildRoot)) {
            throw "paint\build was not generated."
          }

          $solutions = Get-ChildItem `
            -Path $buildRoot `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx")
            }

          if (-not $solutions) {

            Write-Host ""
            Write-Host "No Visual Studio solution was generated."

            Write-Host ""
            Write-Host "Build directory contents:"

            Get-ChildItem `
              -Path $buildRoot `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint Visual Studio solution was not generated."
          }

          Write-Host ""
          Write-Host "Found solution(s):"

          $solutions |
            Select-Object FullName, Length

          # Prefer ArmorPaint.sln
          $solution = $solutions |
            Where-Object {
              $_.Name -eq "ArmorPaint.sln"
            } |
            Select-Object -First 1

          # Current ArmorPaint may generate ArmorPaint.slnx
          if (-not $solution) {
            $solution = $solutions |
              Where-Object {
                $_.Name -eq "ArmorPaint.slnx"
              } |
              Select-Object -First 1
          }

          # Fallback
          if (-not $solution) {
            $solution = $solutions |
              Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected solution:"
          Write-Host $solution.FullName

          "ARMORPAINT_SOLUTION=$($solution.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ==========================================================
      # 9. Build ArmorPaint
      # ==========================================================

      - name: Build ArmorPaint
        shell: cmd
        run: |

          echo ========================================
          echo Building ArmorPaint
          echo ========================================

          echo.
          echo Solution:
          echo %ARMORPAINT_SOLUTION%

          echo.
          echo Configuration:
          echo ${{ inputs.configuration }}

          echo.

          msbuild "%ARMORPAINT_SOLUTION%" ^
            /m ^
            /p:Configuration=${{ inputs.configuration }} ^
            /p:Platform=x64 ^
            /verbosity:minimal

          if errorlevel 1 (
            echo.
            echo ========================================
            echo MSBUILD FAILED
            echo ========================================
            exit /b 1
          )

          echo.
          echo ========================================
          echo MSBUILD SUCCEEDED
          echo ========================================


      # ==========================================================
      # 10. Locate executable
      # ==========================================================

      - name: Locate ArmorPaint executable
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          Write-Host "========================================"
          Write-Host "Searching for ArmorPaint.exe"
          Write-Host "========================================"

          $executables = Get-ChildItem `
            -Path $buildRoot `
            -Filter "ArmorPaint.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $executables) {

            Write-Host ""
            Write-Host "ArmorPaint.exe was not found."

            Write-Host ""
            Write-Host "Executable files found:"

            Get-ChildItem `
              -Path $buildRoot `
              -Filter "*.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint.exe was not generated."
          }

          Write-Host ""
          Write-Host "Found executable(s):"

          $executables |
            Select-Object FullName, Length

          $exe = $executables |
            Where-Object {
              $_.FullName -match "\\x64\\${{ inputs.configuration }}\\ArmorPaint\.exe$"
            } |
            Select-Object -First 1

          if (-not $exe) {
            $exe = $executables |
              Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected executable:"
          Write-Host $exe.FullName

          "ARMORPAINT_EXE=$($exe.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ==========================================================
      # 11. Verify runtime data
      #
      # ArmorPaint currently generates the runtime resources under:
      #
      #   paint/build/out/data
      #
      # This directory contains:
      #
      #   font.ttf
      #   font_cjk.ttc
      #   locale
      #   meshes
      #   plugins
      #   themes
      #   shaders
      #   export presets
      #   etc.
      # ==========================================================

      - name: Verify ArmorPaint runtime data
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          $outDir = Join-Path `
            $buildRoot `
            "out"

          $dataDir = Join-Path `
            $outDir `
            "data"

          Write-Host "========================================"
          Write-Host "Verifying ArmorPaint runtime data"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Runtime directory:"
          Write-Host $outDir

          Write-Host ""
          Write-Host "Data directory:"
          Write-Host $dataDir

          if (-not (Test-Path $outDir)) {
            throw "ArmorPaint out directory was not generated."
          }

          if (-not (Test-Path $dataDir)) {
            throw "ArmorPaint runtime data directory was not generated."
          }

          Write-Host ""
          Write-Host "Runtime files:"

          Get-ChildItem `
            -Path $outDir `
            -Recurse `
            -File |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "Checking required files..."

          $requiredFiles = @(
            (Join-Path $dataDir "font.ttf"),
            (Join-Path $dataDir "font_cjk.ttc"),
            (Join-Path $dataDir "font_mono.ttf"),
            (Join-Path $dataDir "version.json")
          )

          foreach ($file in $requiredFiles) {

            if (Test-Path $file) {
              Write-Host "[OK] $file"
            }
            else {
              Write-Host "[WARNING] Missing: $file"
            }
          }


      # ==========================================================
      # 12. Create portable package
      #
      # Final structure:
      #
      # ArmorPaint-Windows-x64/
      # ├── ArmorPaint.exe
      # └── data/
      #     ├── font.ttf
      #     ├── font_cjk.ttc
      #     ├── locale/
      #     ├── meshes/
      #     ├── plugins/
      #     └── ...
      # ==========================================================

      - name: Prepare portable package
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-Windows-x64"

          $outDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build\out"

          $dataDir = Join-Path `
            $outDir `
            "data"

          Write-Host "========================================"
          Write-Host "Preparing portable ArmorPaint package"
          Write-Host "========================================"

          if (Test-Path $package) {

            Write-Host ""
            Write-Host "Removing existing package..."

            Remove-Item `
              -Path $package `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $package `
            -Force |
            Out-Null

          # ------------------------------------------------------
          # Copy executable
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Copying ArmorPaint.exe..."

          Copy-Item `
            -Path $env:ARMORPAINT_EXE `
            -Destination (Join-Path $package "ArmorPaint.exe") `
            -Force

          # ------------------------------------------------------
          # Copy runtime data
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Copying runtime data..."

          Copy-Item `
            -Path $dataDir `
            -Destination $package `
            -Recurse `
            -Force

          # ------------------------------------------------------
          # Show final package
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Portable package created"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Package directory:"
          Write-Host $package

          Write-Host ""
          Write-Host "Package contents:"

          Get-ChildItem `
            -Path $package `
            -Recurse `
            -File |
            Select-Object FullName, Length


      # ==========================================================
      # 13. Validate portable package
      # ==========================================================

      - name: Validate portable package
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-Windows-x64"

          $exe = Join-Path `
            $package `
            "ArmorPaint.exe"

          $data = Join-Path `
            $package `
            "data"

          Write-Host "========================================"
          Write-Host "Validating portable package"
          Write-Host "========================================"

          if (-not (Test-Path $exe)) {
            throw "ArmorPaint.exe is missing from portable package."
          }

          if (-not (Test-Path $data)) {
            throw "data directory is missing from portable package."
          }

          $files = Get-ChildItem `
            -Path $package `
            -Recurse `
            -File

          $count = @($files).Count

          Write-Host ""
          Write-Host "Package contains $count files."

          if ($count -lt 10) {
            throw "Portable package contains suspiciously few files."
          }

          Write-Host ""
          Write-Host "ArmorPaint.exe:"

          Get-Item $exe |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "CJK font:"

          $font = Join-Path `
            $data `
            "font_cjk.ttc"

          if (Test-Path $font) {

            Get-Item $font |
              Select-Object FullName, Length

            Write-Host ""
            Write-Host "[OK] CJK font is included."

          }
          else {
            Write-Host ""
            Write-Host "[WARNING] CJK font is not included."
          }


      # ==========================================================
      # 14. Create ZIP
      # ==========================================================

      - name: Create ZIP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-Windows-x64"

          $zipName = "ArmorPaint-Windows-x64-${{ inputs.configuration }}.zip"

          $zipPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            $zipName

          Write-Host "========================================"
          Write-Host "Creating ZIP"
          Write-Host "========================================"

          if (Test-Path $zipPath) {

            Remove-Item `
              -Path $zipPath `
              -Force
          }

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "Created ZIP:"

          Get-Item $zipPath |
            Select-Object FullName, Length


      # ==========================================================
      # 15. Upload artifact
      # ==========================================================

      - name: Upload ArmorPaint ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-${{ inputs.configuration }}
          path: ArmorPaint-Windows-x64-${{ inputs.configuration }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
