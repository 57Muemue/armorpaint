name: Build ArmorPaint - Windows x64

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build ArmorPaint Windows x64
    runs-on: windows-2025

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================================
      # 2. Basic environment
      # ==========================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================================
      # 3. Verify environment
      # ==========================================================

      - name: Verify tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Environment"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "NPM:"
          npm --version

          Write-Host ""
          Write-Host "MSBuild:"
          where.exe msbuild

          Write-Host ""
          Write-Host "Clang:"
          where.exe clang-cl

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Working directory:"
          Get-Location

          Write-Host ""
          Write-Host "Repository:"
          Get-ChildItem


      # ==========================================================
      # 4. Check ArmorPaint build tools
      # ==========================================================

      - name: Verify ArmorPaint build system
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $base = Join-Path `
            $env:GITHUB_WORKSPACE `
            "base"

          $paint = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint"

          Write-Host "BASE:"
          Write-Host $base

          Write-Host ""
          Write-Host "PAINT:"
          Write-Host $paint

          if (-not (Test-Path $base)) {
            throw "base directory does not exist."
          }

          if (-not (Test-Path $paint)) {
            throw "paint directory does not exist."
          }

          Write-Host ""
          Write-Host "base/tools:"
          Get-ChildItem "$base\tools" -Recurse -File |
            Select-Object FullName

          Write-Host ""
          Write-Host "Checking amake..."

          $amake = Get-ChildItem `
            "$base\tools\bin" `
            -Recurse `
            -Filter "amake*" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 10

          if (-not $amake) {
            throw "amake executable was not found under base/tools/bin."
          }

          $amake |
            Select-Object FullName, Length


      # ==========================================================
      # 5. Run ArmorPaint official generator
      #
      # Current official command:
      #
      #   cd paint
      #   ..\base\make
      #
      # IMPORTANT:
      # Do NOT hide the output.
      # ==========================================================

      - name: Generate ArmorPaint project
        shell: cmd
        working-directory: paint
        run: |
          echo ========================================
          echo Running ArmorPaint build generator
          echo ========================================

          echo.
          echo Current directory:
          cd

          echo.
          echo Running:
          echo ..\base\make

          echo.

          call ..\base\make

          if errorlevel 1 (
            echo.
            echo ========================================
            echo ARMORPAINT MAKE FAILED
            echo ========================================
            exit /b 1
          )

          echo.
          echo ========================================
          echo ARMORPAINT MAKE FINISHED
          echo ========================================


      # ==========================================================
      # 6. Locate generated Visual Studio solution
      #
      # Do not assume only one exact path.
      # ==========================================================

      - name: Locate generated project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE

          Write-Host "========================================"
          Write-Host "Searching for ArmorPaint.sln"
          Write-Host "========================================"

          $solutions = Get-ChildItem `
            -Path $root `
            -Filter "ArmorPaint.sln" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $solutions) {

            Write-Host ""
            Write-Host "ArmorPaint.sln was NOT found."

            Write-Host ""
            Write-Host "========================================"
            Write-Host "paint directory"
            Write-Host "========================================"

            Get-ChildItem `
              "$root\paint" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            Write-Host ""
            Write-Host "========================================"
            Write-Host "base/tools/bin"
            Write-Host "========================================"

            Get-ChildItem `
              "$root\base\tools\bin" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint.sln was not generated."
          }

          Write-Host ""
          Write-Host "Found solution(s):"

          $solutions |
            Select-Object FullName, Length

          $solution = $solutions | Select-Object -First 1

          "ARMORPAINT_SOLUTION=$($solution.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ==========================================================
      # 7. Build
      # ==========================================================

      - name: Build ArmorPaint
        shell: cmd
        run: |
          echo ========================================
          echo Building ArmorPaint
          echo ========================================

          echo Solution:
          echo %ARMORPAINT_SOLUTION%

          msbuild "%ARMORPAINT_SOLUTION%" ^
            /m ^
            /p:Configuration=${{ inputs.configuration }} ^
            /p:Platform=x64 ^
            /verbosity:minimal

          if errorlevel 1 (
            echo.
            echo ========================================
            echo MSBUILD FAILED
            echo ========================================
            exit /b 1
          )


      # ==========================================================
      # 8. Locate executable
      # ==========================================================

      - name: Locate ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE

          Write-Host "Searching for ArmorPaint.exe..."

          $executables = Get-ChildItem `
            -Path $root `
            -Filter "ArmorPaint.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $executables) {

            Write-Host ""
            Write-Host "ArmorPaint.exe was not found."

            Write-Host ""
            Write-Host "Searching all EXE files..."

            Get-ChildItem `
              -Path "$root\paint" `
              -Filter "*.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint.exe was not generated."
          }

          Write-Host ""
          Write-Host "Found executable(s):"

          $executables |
            Select-Object FullName, Length

          $exe = $executables | Select-Object -First 1

          "ARMORPAINT_EXE=$($exe.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ==========================================================
      # 9. Find portable runtime
      # ==========================================================

      - name: Locate portable runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE

          Write-Host "Searching for krom directory..."

          $kromDirs = Get-ChildItem `
            -Path "$root\paint" `
            -Directory `
            -Recurse `
            -Filter "krom" `
            -ErrorAction SilentlyContinue

          if (-not $kromDirs) {

            Write-Host ""
            Write-Host "No krom directory found."

            Write-Host ""
            Write-Host "Build tree:"
            
            Get-ChildItem `
              "$root\paint\build" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint portable runtime directory was not generated."
          }

          Write-Host ""
          Write-Host "Found krom directories:"

          $kromDirs |
            Select-Object FullName

          $krom = $kromDirs | Select-Object -First 1

          "ARMORPAINT_KROM=$($krom.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ==========================================================
      # 10. Copy executable into krom if necessary
      # ==========================================================

      - name: Prepare portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $krom = $env:ARMORPAINT_KROM
          $exe = $env:ARMORPAINT_EXE

          $targetExe = Join-Path `
            $krom `
            "ArmorPaint.exe"

          Write-Host "Runtime:"
          Write-Host $krom

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $exe

          if (-not (Test-Path $targetExe)) {

            Write-Host ""
            Write-Host "Copying executable into krom..."

            Copy-Item `
              $exe `
              $targetExe `
              -Force
          }

          if (-not (Test-Path $targetExe)) {
            throw "ArmorPaint.exe could not be placed into krom."
          }

          Write-Host ""
          Write-Host "Portable package contents:"

          Get-ChildItem `
            $krom `
            -Recurse `
            -File |
            Select-Object FullName, Length


      # ==========================================================
      # 11. ZIP
      # ==========================================================

      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-Windows-x64-${{ inputs.configuration }}.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:ARMORPAINT_KROM\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "Created:"
          Write-Host $zip

          Get-Item $zip |
            Select-Object FullName, Length


      # ==========================================================
      # 12. Upload artifact
      # ==========================================================

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-${{ inputs.configuration }}
          path: ArmorPaint-Windows-x64-${{ inputs.configuration }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
