name: Build ArmorPaint - Windows x64

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      clean_build:
        description: "Delete previous build directory before compiling"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: ArmorPaint Windows x64 (${{ inputs.configuration }})
    runs-on: windows-2025

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================================
      # 2. Source information
      # ==========================================================

      - name: Show source revision
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "ArmorPaint source information"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Branch:"
          git branch --show-current

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE


      # ==========================================================
      # 3. Setup Visual Studio
      # ==========================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ==========================================================
      # 4. Setup Node.js
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================================
      # 5. Verify tools
      # ==========================================================

      - name: Verify build tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Build environment"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "MSBuild:"
          where.exe msbuild
          msbuild -version

          Write-Host ""
          Write-Host "Clang:"
          where.exe clang-cl
          clang-cl --version

          Write-Host ""
          Write-Host "Visual Studio:"
          Write-Host $env:VisualStudioVersion

          Write-Host ""
          Write-Host "VC Tools:"
          Write-Host $env:VCToolsVersion


      # ==========================================================
      # 6. Clean
      # ==========================================================

      - name: Clean previous build
        if: ${{ inputs.clean_build }}
        shell: powershell
        run: |
          $build = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          if (Test-Path $build) {
            Write-Host "Removing:"
            Write-Host $build

            Remove-Item `
              -Path $build `
              -Recurse `
              -Force
          }
          else {
            Write-Host "No previous build directory."
          }


      # ==========================================================
      # 7. Generate ArmorPaint project
      # ==========================================================

      - name: Generate ArmorPaint project
        shell: cmd
        working-directory: paint
        run: |
          echo ========================================
          echo Generating ArmorPaint Windows project
          echo ========================================

          ..\base\make

          if errorlevel 1 (
            echo.
            echo ========================================
            echo PROJECT GENERATION FAILED
            echo ========================================
            exit /b 1
          )


      # ==========================================================
      # 8. Inspect generated build directory
      #
      # IMPORTANT:
      # Do NOT assume the generated files exist in advance.
      # Print exactly what Iron generated.
      # ==========================================================

      - name: Inspect generated project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          Write-Host "========================================"
          Write-Host "Generated project inspection"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Expected build directory:"
          Write-Host $buildRoot

          if (-not (Test-Path $buildRoot)) {
            throw "paint\build was not generated."
          }

          Write-Host ""
          Write-Host "Build directory exists."

          Write-Host ""
          Write-Host "Top-level contents:"
          Get-ChildItem `
            -Path $buildRoot `
            -Force |
            Select-Object Mode, Length, Name

          Write-Host ""
          Write-Host "Searching for Visual Studio files..."

          $projects = Get-ChildItem `
            -Path $buildRoot `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @(
                ".sln",
                ".slnx",
                ".vcxproj",
                ".vcxproj.filters",
                ".props",
                ".targets"
              )
            }

          if ($projects) {
            Write-Host ""
            Write-Host "Generated project files:"
            $projects |
              Select-Object FullName, Length
          }
          else {
            Write-Host ""
            Write-Host "NO Visual Studio project files found."
            Write-Host ""
            Write-Host "Complete generated build tree:"

            Get-ChildItem `
              -Path $buildRoot `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length
          }


      # ==========================================================
      # 9. Find ArmorPaint solution
      # ==========================================================

      - name: Find ArmorPaint solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          Write-Host "========================================"
          Write-Host "Finding ArmorPaint solution"
          Write-Host "========================================"

          $solutions = Get-ChildItem `
            -Path $buildRoot `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx")
            }

          if (-not $solutions) {
            Write-Host ""
            Write-Host "No .sln/.slnx file was generated."

            Write-Host ""
            Write-Host "Generated files:"
            Get-ChildItem `
              -Path $buildRoot `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint Visual Studio solution was not generated."
          }

          Write-Host ""
          Write-Host "Found solution(s):"

          $solutions |
            Select-Object FullName, Length

          $solution = $solutions |
            Where-Object {
              $_.Name -eq "ArmorPaint.sln"
            } |
            Select-Object -First 1

          if (-not $solution) {
            $solution = $solutions |
              Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected solution:"
          Write-Host $solution.FullName

          "ARMORPAINT_SOLUTION=$($solution.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ==========================================================
      # 10. Build
      # ==========================================================

      - name: Build ArmorPaint
        shell: cmd
        run: |
          echo ========================================
          echo Building ArmorPaint
          echo ========================================

          echo Solution:
          echo %ARMORPAINT_SOLUTION%

          echo.
          echo Configuration:
          echo ${{ inputs.configuration }}

          echo.

          msbuild "%ARMORPAINT_SOLUTION%" ^
            /m ^
            /p:Configuration=${{ inputs.configuration }} ^
            /p:Platform=x64 ^
            /verbosity:minimal

          if errorlevel 1 (
            echo.
            echo ========================================
            echo MSBUILD FAILED
            echo ========================================
            exit /b 1
          )

          echo.
          echo ========================================
          echo MSBUILD SUCCEEDED
          echo ========================================


      # ==========================================================
      # 11. Locate ArmorPaint.exe
      # ==========================================================

      - name: Locate ArmorPaint.exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build"

          Write-Host "========================================"
          Write-Host "Searching for ArmorPaint.exe"
          Write-Host "========================================"

          $executables = Get-ChildItem `
            -Path $buildRoot `
            -Filter "ArmorPaint.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $executables) {
            Write-Host ""
            Write-Host "ArmorPaint.exe was not found."

            Write-Host ""
            Write-Host "Executable files found:"
            Get-ChildItem `
              -Path $buildRoot `
              -Filter "*.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint.exe was not generated."
          }

          Write-Host ""
          Write-Host "Found executable(s):"

          $executables |
            Select-Object FullName, Length

          $exe = $executables |
            Select-Object -First 1

          Write-Host ""
          Write-Host "Selected executable:"
          Write-Host $exe.FullName

          "ARMORPAINT_EXE=$($exe.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ==========================================================
      # 12. Find ArmorPaint build output
      # ==========================================================

      - name: Find ArmorPaint build output
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "paint\build"

          Write-Host "========================================"
          Write-Host "Searching ArmorPaint build output"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Build directory:"
          Write-Host $buildRoot

          if (-not (Test-Path $buildRoot)) {
            throw "Build directory does not exist: $buildRoot"
          }

          Write-Host ""
          Write-Host "Searching for ArmorPaint.exe..."

          $exe = Get-ChildItem `
            -Path $buildRoot `
            -Filter "ArmorPaint.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {

            Write-Host ""
            Write-Host "ArmorPaint.exe was not found."
            Write-Host ""
            Write-Host "Build directory tree:"
            
            Get-ChildItem `
              -Path $buildRoot `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "ArmorPaint.exe was not generated."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Found ArmorPaint.exe"
          Write-Host "========================================"
          Write-Host $exe.FullName
          Write-Host ""

          Write-Host "Searching for executable directory contents..."

          $exeDir = $exe.Directory.FullName

          Get-ChildItem `
            -Path $exeDir `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

          "ARMORPAINT_EXE=$($exe.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          "ARMORPAINT_EXE_DIR=$exeDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # ==========================================================
      # Show build output
      # ==========================================================

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "ArmorPaint build output"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $env:ARMORPAINT_EXE

          Write-Host ""
          Write-Host "Directory:"
          Write-Host $env:ARMORPAINT_EXE_DIR

          Write-Host ""
          Write-Host "Files:"
          Get-ChildItem `
            -Path $env:ARMORPAINT_EXE_DIR `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # ==========================================================
      # 13. CJK font
      # ==========================================================

      - name: Prepare CJK font
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $krom = Join-Path `
            $env:GITHUB_WORKSPACE `
            "paint\build\krom"

          $dataDir = Join-Path `
            $krom `
            "data"

          if (-not (Test-Path $dataDir)) {
            New-Item `
              -ItemType Directory `
              -Path $dataDir `
              -Force |
              Out-Null
          }

          $fonts = @(
            (Join-Path `
              $env:GITHUB_WORKSPACE `
              "paint\assets\common\extra\font_cjk.ttc"),

            (Join-Path `
              $env:GITHUB_WORKSPACE `
              "paint\Assets\common\extra\font_cjk.ttc")
          )

          $font = $fonts |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if ($font) {
            Write-Host "Copying CJK font:"
            Write-Host $font

            Copy-Item `
              -Path $font `
              -Destination (Join-Path $dataDir "font_cjk.ttc") `
              -Force
          }
          else {
            Write-Host "CJK font not found; skipping."
          }
